.filtro-btn{font-family:var(--font);font-size:12.5px;font-weight:400;color:var(--gris-90);background:var(--surface-2);border:1.6px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;transition:all .15s}
.filtro-btn:hover{border-color:var(--ps-azul)}
.filtro-btn.activo{border-color:var(--ps-azul);background:rgba(0,31,89,.06);color:var(--ps-azul)}
.filtro-btn .badge{background:var(--ps-azul);color:#fff;font-size:10px;font-weight:400;border-radius:10px;padding:1px 7px;min-width:17px;text-align:center}
.filtro-btn .car{font-size:9px;color:var(--text-muted);transition:transform .15s}
.filtro-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:950;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.16);width:290px;max-height:380px;display:flex;flex-direction:column}
.filtro-panel.oculto{display:none}
.filtro-search{padding:10px;border-bottom:1px solid var(--line-soft)}
.filtro-search input{width:100%;font-family:var(--font);font-size:12.5px;border:1.4px solid var(--line);border-radius:7px;padding:7px 10px;outline:none}
.filtro-search input:focus{border-color:var(--ps-azul)}
.filtro-acciones{display:flex;justify-content:space-between;padding:0 10px;gap:6px}
.filtro-acciones button{flex:1;font-family:var(--font);font-size:10.5px;font-weight:400;letter-spacing:.03em;text-transform:uppercase;background:none;border:none;color:var(--ps-azul);padding:7px 4px;cursor:pointer;transition:background .12s}
.filtro-acciones button:hover{background:rgba(0,31,89,.07)}
.filtro-lista{overflow-y:auto;padding:6px 4px;flex:1}
.filtro-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--gris-90)}
.filtro-item:hover{background:var(--surface-2)}
.filtro-item input{accent-color:var(--ps-azul);width:14px;height:14px;flex-shrink:0}
.filtro-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filtro-item .cnt{margin-left:auto;font-size:10px;color:var(--text-muted);flex-shrink:0}
.filtro-vacio{padding:20px;text-align:center;font-size:11.5px;color:var(--text-muted)}
.btn-clear{font-family:var(--font);font-size:12px;font-weight:400;color:var(--ps-rojo);background:none;border:1.6px solid rgba(216,0,25,.3);border-radius:8px;padding:8px 13px;cursor:pointer;transition:all .15s}
.btn-clear:hover{background:rgba(216,0,25,.06)}
.filtros-count{margin-left:auto;font-size:12px;font-weight:400;color:var(--ps-azul);background:rgba(0,31,89,.07);border:1px solid rgba(0,31,89,.16);padding:8px 16px;border-radius:20px;white-space:nowrap}

/* Titulo dashboard */
.dash-head{max-width:var(--maxw);margin:0 auto;padding:26px 22px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dash-head h1{font-size:clamp(21px,2.6vw,30px);font-weight:800;color:var(--gris-100);letter-spacing:-.6px}
.dash-head h1 em{font-style:normal;color:var(--ps-azul)}
.dash-head p{font-size:12.5px;color:var(--text-muted);margin-top:4px;font-weight:400}
.btn-pdf-main{font-family:var(--font);font-size:12.5px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;background:var(--ps-rojo);color:#fff;border:none;border-radius:9px;padding:12px 24px;cursor:pointer;transition:all .2s}
.btn-pdf-main:hover{background:#b30015}
.btn-pdf-main:active{transform:scale(.97)}
.btn-pdf-main:disabled{opacity:.6;cursor:wait}

/* Dashboard grid */
.dash{max-width:var(--maxw);margin:0 auto;padding:18px 22px 60px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.panel h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gris-90);margin-bottom:2px}
.panel .sub{font-size:22px;font-weight:400;color:var(--ps-azul);margin-bottom:14px;letter-spacing:-.5px}
.panel-note{font-size:9.5px;color:var(--text-muted);text-align:right;margin-top:8px}

.c-3{grid-column:span 3} .c-4{grid-column:span 4} .c-6{grid-column:span 6}
.c-8{grid-column:span 8} .c-12{grid-column:span 12} .c-9{grid-column:span 9}
.c-2{grid-column:span 2}

/* KPI */
.kpi{border-left:4px solid var(--c,var(--ps-azul));display:flex;flex-direction:column;justify-content:center;min-height:104px}
.kpi .l{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);font-weight:400;margin-bottom:8px}
.kpi .v{font-size:29px;font-weight:400;color:var(--gris-100);letter-spacing:-1px;line-height:1}
.kpi .v .u{font-size:13px;color:var(--text-muted);font-weight:400;margin-left:4px;letter-spacing:0}
.kpi .f{margin-top:8px;font-size:11px;color:var(--text-muted);font-weight:400}

/* Barras horizontales tipo lista - SIN SCROLL HORIZONTAL */
.hbar-list{display:flex;flex-direction:column;gap:11px;max-height:340px;overflow-y:auto;overflow-x:hidden;padding-right:4px}
.hbar-row{cursor:pointer;border-radius:6px;padding:3px 5px;margin:0 -5px;transition:background .12s;word-wrap:break-word}
.hbar-row:hover{background:rgba(0,31,89,.05)}
.hbar-row.activo{background:rgba(0,31,89,.09)}
.hbar-row.activo .top .n{color:var(--ps-azul)}
.hbar-row.atenuado{opacity:.4}
.hbar-row .top{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;flex-wrap:wrap}
.hbar-row .top .n{font-weight:400;color:var(--gris-90);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:76%;flex-shrink:1}
.hbar-row .top .q{font-weight:400;color:var(--ps-azul);flex-shrink:0}
.hbar-track{height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden;width:100%}
.hbar-fill{display:block;height:100%;border-radius:5px;background:var(--ps-azul)}
.panel canvas{cursor:pointer}
.cross-hint{font-size:10px;color:var(--text-muted);font-style:italic;margin-top:6px}

/* Gauge */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.gauge{position:relative;width:170px;height:100px;overflow:hidden}
.gauge .ring{
  position:absolute;top:0;left:0;width:170px;height:170px;border-radius:50%;
  background:var(--surface-3);
}
.gauge .mask{position:absolute;top:16px;left:16px;width:138px;height:138px;border-radius:50%;background:#fff}
.gauge .needle{
  position:absolute;bottom:0;left:83px;width:3px;height:76px;background:var(--gris-100);
  transform-origin:bottom center;
  transform:rotate(calc((var(--pct,0)*1.8 - 90) * 1deg));
  border-radius:2px;z-index:5;transition:transform .4s ease;
}
.gauge .pivot{position:absolute;bottom:-6px;left:77px;width:14px;height:14px;border-radius:50%;background:var(--gris-100);z-index:6}
.gauge-num{font-size:24px;font-weight:400;color:var(--gris-100);text-align:center}
.gauge-scale{display:flex;justify-content:space-between;width:170px;font-size:9.5px;color:var(--text-muted);font-weight:400}

/* Estado badges */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font-size:10.5px;font-weight:400;padding:5px 11px;border-radius:20px;background:var(--surface-2);color:var(--gris-90);border:1px solid var(--line)}

/* Mapa - Tamaño mejorado */

.popup-proy .estado{display:inline-block;margin-top:6px;font-size:10px;font-weight:400;padding:3px 9px;border-radius:12px;color:#fff}

/* Tabla maestra */
.tabla-wrap{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
table.master{width:100%;border-collapse:collapse;font-size:11.8px}
table.master thead th{position:sticky;top:0;background:var(--ps-azul);color:#fff;text-align:left;padding:11px 12px;font-weight:400;font-size:10px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
table.master tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--gris-90);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.master tbody tr:hover{background:var(--surface-2)}
table.master tbody tr:nth-child(even){background:rgba(0,31,89,.02)}
.tag-estado{font-size:10px;font-weight:400;padding:3px 9px;border-radius:12px;color:#fff;display:inline-block}

/* Footer */
footer{background:var(--ps-azul);color:#fff;margin-top:10px}

.fin{max-width:var(--maxw);margin:0 auto;padding:26px 22px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.fin .fb{display:flex;align-items:center;gap:15px}
.fin img{height:34px}
.fin .fi{font-size:11px;color:rgba(255,255,255,.66);line-height:1.6}
.fin .fc{font-size:10px;color:rgba(255,255,255,.48);text-align:right;line-height:1.6}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted)}
